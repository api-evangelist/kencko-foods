name: Kencko Foods
description: >-
  Kencko is a direct-to-consumer functional-food company that makes no-fuss
  instant smoothies and other whole-food products from 100% organic, vegan,
  freeze-dried fruits and vegetables with no added sugars. Customers subscribe
  and shop through a Shopify-hosted online store at kencko.com. Kencko is a
  Techstars-backed portfolio company and was added to the API Evangelist network
  as a stub lead for the enrichment pipeline. It publishes no first-party
  developer API; the only machine-readable discovery surface on its domain is the
  Shopify Customer Account API OIDC/OAuth well-known configuration that backs
  storefront customer login.
